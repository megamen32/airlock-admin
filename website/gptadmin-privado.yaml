# git-privado config — gptadmin private → public
source: /tmp/gptadmin-private
target: megamen32/gptadmin_opensource

delete:
  - "apps/"
  - "GPTADMIN_PROMPT.md"
  - "docs/old_prompt.txt"
  - "docs/GPTADMIN_INSTRUCTIONS.md"
  - "docs/FILE_BACKUPS.md"
  - "public/gptadmin_infrastructure_mcp_instructions.md"
  - "public/gptadmin_instructions_under_8000.md"
  - "deploy/nginx/became.bezrabotnyi.com.conf"
  - "deploy/setup_nginx.sh"
  - "MCP_SERVERS.md"
  - ".claude/"
  - ".serena/"
  - "scripts/check_mac_tunnel_matrix.py"
  - "scripts/check_mac_tunnel_matrix.env"

replace:
  - "aofhkLSD25i==>***REMOVED***"
  - "95.165.165.65==>203.0.113.10"
  - "95.31.7.115==>203.0.113.11"
  - "roomhacker-server-100==>server-01"
  - "roomhacker-server-88==>server-02"
  - "server-44==>server-03"
  - "roomhacker==>admin"
  - "192.168.1.==>10.0.0."
  - "192.168.2.==>10.0.0."
  - "megamen932@gmai.com==>noreply@example.com"
  - "https://gptadmin.bezrabotnyi.com==>https://became.bezrabotnyi.com"
  - "gptadmin.bezrabotnyi.com==>became.bezrabotnyi.com"

allow_domains:
  - "became.bezrabotnyi.com"
  - "t.gptadmin.bezrabotnyi.com"
  - "github.com"
  - "example.com"
  - "example.org"
  - "frp.bezrabotnyi.com"

fail_on_match:
  - "regex:github_pat_[A-Za-z0-9_]{30,}"
  - "regex:gh[po]sr?_[A-Za-z0-9]{36,}"
  - "regex:sk-[A-Za-z0-9]{40,}"
  - "regex:95\\.165\\."
  - "regex:95\\.31\\.7\\."
  - "regex:roomhacker"
  - "regex:server-44"
  - "regex:server-88"
  - "regex:server-100"

push:
  force: true
  branches: [main]
  tags: false
