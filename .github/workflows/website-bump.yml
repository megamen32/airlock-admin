name: Website Submodule Bump

# The `website/` submodule is its own repo (megamen32/adminchatgpt_website).
# Translate-docs commits land there. We periodically pull the latest main
# and bump the pointer so the deployed docs stay current.

on:
  schedule:
    # Twice a day at 06:17 and 18:17 UTC (off the :00 mark so we don't
    # collide with other CI bursts).
    - cron: '17 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GPTADMIN_BOT_PAT }}

      - name: Bump if behind
        run: |
          set -e
          git -C website fetch origin main
          CURRENT=$(git ls-tree HEAD website | awk '{print $3}')
          REMOTE=$(git ls-remote origin website main | awk '{print $1}')
          echo "current=$CURRENT"
          echo "remote =$REMOTE"
          if [ "$CURRENT" = "$REMOTE" ]; then
            echo "Already up to date."
            exit 0
          fi
          git submodule set-branch --branch main website
          git submodule update --remote website
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              add website
          git -c user.email="github-actions[bot]@users.noreply.github.com" \
              -c user.name="github-actions[bot]" \
              commit -m "chore(website): bump submodule to ${REMOTE:0:7}

          Auto-bumped by website-bump.yml."
          git push
