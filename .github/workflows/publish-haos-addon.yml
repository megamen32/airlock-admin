name: Publish HAOS Hub Standby App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  FRP_VERSION: "0.64.0"
  IMAGE_NAME: ghcr.io/megamen32/gptadmin-haos-hub-standby

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read app version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          text = Path("deploy/homeassistant/gptadmin_hub_standby/public_config.yaml").read_text()
          match = re.search(r'^version:\s*["\']([^"\']+)', text, re.MULTILINE)
          if not match:
              raise SystemExit("public app version is missing")
          print(f"version={match.group(1)}")
          PY

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go-hub/go.mod

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble sanitized ARM64 image context
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/gptadmin-haos-image"
          mkdir -p "$context/public"
          cp deploy/homeassistant/gptadmin_hub_standby/Dockerfile.public "$context/Dockerfile"
          cp deploy/homeassistant/gptadmin_hub_standby/run.sh "$context/run.sh"
          cp scripts/gptadmin_failover_watchdog.py scripts/gptadmin_failover_proxy.py "$context/"
          cp deploy/homeassistant/gptadmin_hub_standby/gptadmin_failover_runtime.py \
            deploy/homeassistant/gptadmin_hub_standby/gptadmin_failover_config.py "$context/"
          cp deploy/homeassistant/gptadmin_hub_standby/public_standby_index.html "$context/public/index.html"
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -ldflags "-X github.com/megamen32/gptadmin/go-hub/internal/hub.BuildVersion=$APP_VERSION -X github.com/megamen32/gptadmin/go-hub/internal/hub.GitCommit=${GITHUB_SHA}" \
            -o "$context/gptadmin_hub" ./go-hub/cmd/gptadmin-hub
          archive="frp_${FRP_VERSION}_linux_arm64.tar.gz"
          curl -fsSL "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/${archive}" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "https://github.com/fatedier/frp/releases/download/v${FRP_VERSION}/frp_${FRP_VERSION}_checksums.txt" -o "$RUNNER_TEMP/frp_checksums.txt"
          grep "  $archive$" "$RUNNER_TEMP/frp_checksums.txt" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/frp_${FRP_VERSION}_linux_arm64/frpc" "$context/frpc"
          chmod 0755 "$context/gptadmin_hub" "$context/frpc"
          echo "$context" > "$RUNNER_TEMP/haos_image_context"

      - name: Build and publish ARM64 image
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          context=$(cat "$RUNNER_TEMP/haos_image_context")
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --tag "$IMAGE_NAME:$APP_VERSION" \
            --tag "$IMAGE_NAME:latest" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file "$RUNNER_TEMP/haos-image-metadata.json" \
            --push "$context"

      - name: Verify HAOS image provenance
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/haos-image-metadata.json"
          test -s "$metadata"
          jq -e '."containerimage.digest" | strings | test("^sha256:[0-9a-f]{64}$")' "$metadata" >/dev/null
          docker buildx imagetools inspect "$IMAGE_NAME:$APP_VERSION" \
            --format '{{json .Manifest.Digest}}' | grep -Eq '^"sha256:[0-9a-f]{64}"$'

      - name: Export sanitized Apps repository artifact
        run: |
          set -euo pipefail
          scripts/export_haos_app_repository.sh \
            --output "$RUNNER_TEMP/gptadmin-haos-addons" \
            --source-ref "$GITHUB_SHA"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/gptadmin-haos-addons.tar.gz" gptadmin-haos-addons

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gptadmin-haos-addons-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/gptadmin-haos-addons.tar.gz

      - name: Detect public repository sync token
        id: sync_token
        env:
          TOKEN: ${{ secrets.HAOS_ADDONS_REPO_TOKEN }}
        run: echo "configured=$([[ -n \"$TOKEN\" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Sync public Apps repository when a token is configured
        if: steps.sync_token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.HAOS_ADDONS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/gptadmin-haos-addons-git"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/megamen32/gptadmin-haos-addons.git" "$target"
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/gptadmin-haos-addons/" "$target/"
          git -C "$target" config user.name github-actions[bot]
          git -C "$target" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$target" add .
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m "release: sync GPTAdmin Hub Standby ${{ steps.version.outputs.version }}"
            git -C "$target" push origin main
          fi
