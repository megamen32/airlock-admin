name: Build, Sync, Release

# Builds binaries on every push to main and every v* tag.
# On v* tags (release), also: mirror source into the PUBLIC repo
# megamen32/gptadmin_opensource, push the tag there, and publish all built
# archives as GitHub Release ASSETS (not committed into git history — that was
# the old design and bloated the repo by ~500MB per release for no benefit,
# since became.bezrabotnyi.com serves from its own local build/ anyway).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: gptadmin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: write

env:
  OPENSOURCE_PAT: ${{ secrets.OPENSOURCE_PAT }}

jobs:
  admin-ui-build:
    # The React UI is build-tested independently. The release package puts it
    # at /admin/ with native operations; /admin/legacy/ redirects there.
    runs-on: [self-hosted, Linux, X64, gptadmin-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install admin UI dependencies
        working-directory: admin-ui
        timeout-minutes: 8
        env:
          NPM_CONFIG_FETCH_RETRIES: 4
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 1000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 10000
          NPM_CONFIG_FETCH_TIMEOUT: 30000
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test admin UI
        working-directory: admin-ui
        run: npm test

      - name: Lint admin UI
        working-directory: admin-ui
        run: npm run lint

      - name: Build admin UI
        working-directory: admin-ui
        run: npm run build -- --base=/admin/

      - name: Verify admin UI asset base
        working-directory: admin-ui
        run: |
          test -s dist/index.html
          grep -q '/admin/assets/' dist/index.html

  failover-e2e:
    # The suite builds its own Go image and needs no repository-hosted service.
    # Keep it separate so HA regressions are visible independently from releases.
    runs-on: [self-hosted, Linux, X64, gptadmin-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run failover Docker black-box suite
        run: docker compose -f tests/e2e/failover/docker-compose.yml up --build --abort-on-container-exit --exit-code-from failover-e2e

  docs-as-code-contract:
    name: Docs-as-code contract
    runs-on: [self-hosted, Linux, X64, gptadmin-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false

      - name: Verify root docs-as-code contract
        run: |
          uv sync
          uv run pytest tests/test_site_docs.py tests/test_openapi_artifact.py tests/test_docs_product_contract.py tests/test_public_mirror.py tests/test_install_scripts.py -q

  candidate-client-contract:
    name: Candidate client contract
    # Runs locally on every main push/tag so a source change cannot reach
    # release packaging unless the built Hub still behaves like both clients.
    runs-on: [self-hosted, Linux, X64, gptadmin-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
          cache-dependency-path: go-hub/go.sum

      - name: Setup Node for Hub public payload
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build Hub candidate artifact
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh hub

      - name: Black-box candidate as Custom GPT and native MCP client
        run: |
          python3 scripts/ci_candidate_contract.py \
            --package build/gptadmin-hub.tar.gz \
            --client-origin https://u-f1102930.t.gptadmin.bezrabotnyi.com

  build-and-release:
    # Main pushes already run validation jobs and are auto-tagged separately.
    # Build/publish artifacts only for an actual tag (or an explicit manual run)
    # to avoid duplicate full builds racing the tagged release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [admin-ui-build, failover-e2e, docs-as-code-contract, candidate-client-contract, macos-build, windows-shellmcp]
    runs-on: [self-hosted, Linux, X64, gptadmin-ci]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
          cache-dependency-path: |
            go-hub/go.sum
            go-shellmcp/go.sum
            go-proxyrelay/go.sum

      - name: Setup Node for packaged admin UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Android SDK command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android NDK for x64 release bundles
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_X86_64_CC=${ANDROID_HOME}/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Install Python dependencies and test
        run: |
          uv sync
          uv run pytest tests/ -v

      - name: Docs product contract
        run: uv run pytest tests/test_docs_product_contract.py tests/test_feedback_loop_contract.py -q

      - name: Test Go hub
        run: |
          cd go-hub
          go test ./...

      - name: Test Go shellmcp
        run: |
          cd go-shellmcp
          go test ./...

      - name: Test Go proxyrelay
        run: |
          cd go-proxyrelay
          go test ./...

      - name: Sanitize tree for public bundles
        run: bash scripts/publicize_sanitize.sh

      - name: Build binaries
        run: |
          chmod +x tools/build.sh
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            TAGGED_RELEASE=1 RELEASE_TAG="${GITHUB_REF_NAME}" RELEASE_COMMIT="$release_commit" ./tools/build.sh
          else
            ./tools/build.sh
          fi

      - name: Gate the exact release Hub artifact before publication
        run: |
          python3 scripts/ci_candidate_contract.py \
            --package build/gptadmin-hub.tar.gz \
            --client-origin https://u-f1102930.t.gptadmin.bezrabotnyi.com

      - name: Verify user-facing release matrix
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("build")
          matrix = json.loads((root / "gptadmin-release-matrix.json").read_text())
          artifacts = matrix["artifacts"]
          assert len(artifacts) == 16, len(artifacts)
          assert {(a["platform"], a["arch"], a["edition"]) for a in artifacts} == {
              (platform, arch, edition)
              for platform in ("windows", "macos", "ubuntu", "android")
              for arch in ("x64", "arm64")
              for edition in ("full", "client")
          }
          for artifact in artifacts:
              path = root / artifact["file"]
              assert path.is_file() and path.stat().st_size > 0, path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == artifact["sha256"], path
          assert len((root / "gptadmin-checksums.txt").read_text().splitlines()) == 16
          PY

      - name: Verify complete release provenance manifest
        run: |
          python3 tools/verify_release_manifest.py verify \
            --root "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/build/manifest.json"
          test -s build/manifest.json
          test -s build/gptadmin-sbom.spdx.json

      - name: Verify installer links for shipped targets
        run: |
          python3 tools/verify_installer_links.py \
            --installer deploy/install.sh \
            --target linux/amd64 \
            --target darwin/arm64 \
            --android \
            --json

      - name: Scan dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
          (
            cd go-hub
            "$GOVULNCHECK" ./...
          )
          (
            cd go-shellmcp
            "$GOVULNCHECK" ./...
          )
          (
            cd go-proxyrelay
            "$GOVULNCHECK" ./...
          )
          npm audit --prefix admin-ui --omit=dev --audit-level=high

      - name: Attest verified release artifacts
        # GitHub does not offer artifact attestations for user-owned private
        # repositories. Do not block the verified public release on that
        # platform limitation; the manifest/SBOM and security gates above
        # remain mandatory for every tagged release.
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/*.tar.gz
            build/*.zip
            build/manifest.json
            build/gptadmin-sbom.spdx.json

      - name: Publish GitHub Release on private repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ env.OPENSOURCE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_assets=()
          for asset in build/gptadmin-{windows,macos,ubuntu,android}-{x64,arm64}-{full,client}.{zip,tar.gz}; do
            [[ -f "$asset" ]] && release_assets+=("$asset")
          done
          release_assets+=(
            build/gptadmin-checksums.txt
            build/gptadmin-release-matrix.json
          )
          [[ ${#release_assets[@]} -eq 18 ]] || {
            echo "ERROR: expected 16 bundles plus checksums and matrix, got ${#release_assets[@]}" >&2
            exit 1
          }
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Private release $TAG already exists."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --generate-notes \
              "${release_assets[@]}"
          fi

      # --- Release: only on v* tags, only if the opensource PAT is configured ---
      - name: Checkout opensource (public) repo
        if: startsWith(github.ref, 'refs/tags/v') && env.OPENSOURCE_PAT != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: megamen32/gptadmin_opensource
          token: ${{ env.OPENSOURCE_PAT }}
          path: gptadmin_opensource
          fetch-depth: 0

      - name: Tag + GitHub Release on public repo
        if: startsWith(github.ref, 'refs/tags/v') && env.OPENSOURCE_PAT != ''
        env:
          GH_TOKEN: ${{ env.OPENSOURCE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PUB="$GITHUB_WORKSPACE/gptadmin_opensource"
          SRC="$GITHUB_WORKSPACE"
          # Source mirroring is owned by local `git-private2public` (rules in
          # .gitpublic/): this job must NOT rsync the raw private tree into the
          # public repo, or personal infrastructure leaks straight into the
          # mirror. Only the tag and release assets are published here.
          cd "$PUB"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "chore: sync source from private repo ${TAG}"
          fi

          expected_public_commit="$(git rev-parse HEAD)"
          # User-facing release: 16 named OS/architecture/edition bundles,
          # one checksum list and one machine-readable catalogue. Internal
          # component archives, SBOM and provenance stay CI artifacts.
          # Bundle-name contract: gptadmin-{windows,macos,ubuntu,android}-{x64,arm64}-{full,client}.{zip,tar.gz}
          release_assets=()
          while IFS= read -r asset_name; do
            asset="$SRC/build/$asset_name"
            [[ -f "$asset" ]] && release_assets+=("$asset")
          done < <(python3 -c 'import json, sys; print(*[artifact["file"] for artifact in json.load(open(sys.argv[1]))["artifacts"]], sep="\n")' "$SRC/build/gptadmin-release-matrix.json")
          release_assets+=(
            "$SRC"/build/gptadmin-checksums.txt
            "$SRC"/build/gptadmin-release-matrix.json
          )
          [[ ${#release_assets[@]} -eq 18 ]] || {
            echo "ERROR: expected 16 bundles plus checksums and matrix, got ${#release_assets[@]}" >&2
            exit 1
          }
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "ERROR: missing release asset: $asset" >&2
              exit 1
            fi
          done
          expected_assets="$({
            for asset in "${release_assets[@]}"; do
              digest="$(sha256sum "$asset" | awk '{print $1}')"
              printf '%s\tsha256:%s\n' "$(basename "$asset")" "$digest"
            done
          } | LC_ALL=C sort)"

          echo "=== Preflight immutable public tag ${TAG} ==="
          public_tag_exists=false
          remote_tag_lines="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          if [[ -n "$remote_tag_lines" ]]; then
            remote_tag_commit="$(printf '%s\n' "$remote_tag_lines" | awk '$2 ~ /\^\{\}$/ {print $1}')"
            if [[ -z "$remote_tag_commit" ]]; then
              remote_tag_commit="$(printf '%s\n' "$remote_tag_lines" | awk '$2 !~ /\^\{\}$/ {print $1}')"
            fi
            if [[ "$remote_tag_commit" != "$expected_public_commit" ]]; then
              echo "ERROR: public tag ${TAG} targets ${remote_tag_commit}, expected ${expected_public_commit}" >&2
              exit 1
            fi
            public_tag_exists=true
          fi

          echo "=== Preflight immutable public release ${TAG} ==="
          release_response="$RUNNER_TEMP/gptadmin-public-release-${TAG}.txt"
          release_error="$RUNNER_TEMP/gptadmin-public-release-${TAG}.err"
          release_status=404
          if gh api --include "repos/megamen32/gptadmin_opensource/releases/tags/${TAG}" >"$release_response" 2>"$release_error"; then
            release_status=200
          else
            release_status="$(awk '/^HTTP\// {status=$2} END {print status}' "$release_response")"
            if [[ "$release_status" != 404 ]]; then
              echo "ERROR: failed to inspect existing public release ${TAG}" >&2
              sed -n '1,20p' "$release_error" >&2
              exit 1
            fi
          fi

          if [[ "$release_status" == 200 ]]; then
            actual_release_tag="$(gh release view "${TAG}" --repo megamen32/gptadmin_opensource --json tagName --jq '.tagName')"
            if [[ "$actual_release_tag" != "$TAG" ]]; then
              echo "ERROR: public release tag ${actual_release_tag} does not match ${TAG}" >&2
              exit 1
            fi
            actual_assets="$(gh release view "${TAG}" --repo megamen32/gptadmin_opensource --json assets --jq '.assets[] | [.name, (.digest // "")] | @tsv' | LC_ALL=C sort)"
            if [[ "$actual_assets" != "$expected_assets" ]]; then
              echo "ERROR: public release ${TAG} assets do not exactly match local artifact digests" >&2
              exit 1
            fi
          fi

          echo "=== Immutable public identity preflight passed ==="
          git push origin HEAD:main

          if [[ "$public_tag_exists" == true ]]; then
            echo "Public tag ${TAG} already targets the expected commit."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

          echo "=== Publish GitHub Release on public repo with binary assets ==="
          if [[ "$release_status" == 200 ]]; then
            echo "Public release ${TAG} already has the exact expected assets; nothing to upload."
          else
            gh release create "${TAG}" --repo megamen32/gptadmin_opensource \
              --title "${TAG}" --generate-notes \
              "${release_assets[@]}"
          fi
          echo "=== Public release published: https://github.com/megamen32/gptadmin_opensource/releases/tag/${TAG} ==="

      - name: Skip release when not a tag or PAT missing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.OPENSOURCE_PAT == '' }}
        run: |
          echo "Build finished."
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "(Not a tag — skipping release/public-sync. Binaries were built and tested only.)"
          fi
          if [[ -z "${OPENSOURCE_PAT}" ]]; then
            echo "(OPENSOURCE_PAT secret not configured — skipped public repo sync/release.)"
          fi

  macos-build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Catches Darwin-only regressions before a release. We just want real darwin
    # runtime coverage (syscall/exec behavior used by launchd auto-update) plus
    # proof that Mac can produce Linux artifacts. No secrets, no opensource
    # sync, no service install — those are Linux-only and run in build-and-release.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: |
            go-hub/go.sum
            go-shellmcp/go.sum

      - name: Test Go hub on darwin
        run: |
          cd go-hub
          go test ./...

      - name: Test Go shellmcp on darwin
        run: |
          cd go-shellmcp
          go test ./...

      - name: Cross-compile Linux artifacts from Mac
        run: |
          cd go-hub
          GOOS=linux GOARCH=amd64 go build ./...

      - name: Parse Python CLI
        run: python3 -c "import ast; ast.parse(open('cli.py').read())"

  windows-shellmcp:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Windows needs a real runner: cross-compilation cannot exercise cmd.exe
    # process creation or the installer-compatible polling configuration.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: go-shellmcp/go.sum

      - name: Compile every Go Hub package for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Set-Location go-hub
          go test -run '^$' ./...
          go build -o ../build/windows/gptadmin-hub.exe ./cmd/gptadmin-hub

      - name: Compile every Go ShellMCP package for Windows
        shell: pwsh
        run: |
          Set-Location go-shellmcp
          go test -run '^$' ./...
          go build -o ../build/windows/shellmcp.exe ./cmd/shellmcp-go

      - name: Exercise Windows polling configuration contract
        shell: pwsh
        run: |
          Set-Location go-shellmcp
          go test ./internal/server -run '^(TestFromEnvUsesWindowsInstallerPollingContract|TestQueueTransportNeverNeedsLocalListener)$' -count=1
