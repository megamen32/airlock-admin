name: Build, Sync, Release

# Builds binaries on every push to main and every v* tag.
# On v* tags (release), also: mirror source into the PUBLIC repo
# megamen32/gptadmin_opensource, push the tag there, and publish all built
# archives as GitHub Release ASSETS (not committed into git history — that was
# the old design and bloated the repo by ~500MB per release for no benefit,
# since became.bezrabotnyi.com serves from its own local build/ anyway).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENSOURCE_PAT: ${{ secrets.OPENSOURCE_PAT }}

jobs:
  admin-ui-build:
    # The React UI is build-tested independently. The release package puts it
    # at /admin/ and keeps the complete operational shell at /admin/legacy/.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install admin UI dependencies
        working-directory: admin-ui
        run: npm ci

      - name: Test admin UI
        working-directory: admin-ui
        run: npm test

      - name: Lint admin UI
        working-directory: admin-ui
        run: npm run lint

      - name: Build admin UI
        working-directory: admin-ui
        run: npm run build -- --base=/admin/

      - name: Verify admin UI asset base
        working-directory: admin-ui
        run: |
          test -s dist/index.html
          grep -q '/admin/assets/' dist/index.html

  failover-e2e:
    # The suite builds its own Go image and needs no repository-hosted service.
    # Keep it separate so HA regressions are visible independently from releases.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run failover Docker black-box suite
        run: docker compose -f tests/e2e/failover/docker-compose.yml up --build --abort-on-container-exit --exit-code-from failover-e2e

  build-and-release:
    needs: [admin-ui-build, failover-e2e, macos-build, windows-shellmcp]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout private repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: |
            go-hub/go.sum
            go-shellmcp/go.sum
            go-proxyrelay/go.sum

      - name: Setup Node for packaged admin UI
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install Python dependencies and test
        run: |
          uv sync
          uv run pytest tests/ -v

      - name: Docs product contract
        run: uv run pytest tests/test_docs_product_contract.py tests/test_feedback_loop_contract.py -q

      - name: Test Go hub
        run: |
          cd go-hub
          go test ./...

      - name: Test Go shellmcp
        run: |
          cd go-shellmcp
          go test ./...

      - name: Test Go proxyrelay
        run: |
          cd go-proxyrelay
          go test ./...

      - name: Build binaries
        run: |
          chmod +x tools/build.sh
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
            TAGGED_RELEASE=1 RELEASE_TAG="${GITHUB_REF_NAME}" RELEASE_COMMIT="$release_commit" ./tools/build.sh
          else
            ./tools/build.sh
          fi

      - name: Verify Android release artifact
        run: |
          test -s build/gptadmin-android-arm64.tar.gz
          tar -tzf build/gptadmin-android-arm64.tar.gz | grep -qx 'bin/shellmcp'
          test "$(cat build/gptadmin-android-arm64.version)" = "$(cat VERSION)"

      - name: Verify complete release provenance manifest
        run: |
          python3 tools/verify_release_manifest.py verify \
            --root "$GITHUB_WORKSPACE" \
            --manifest "$GITHUB_WORKSPACE/build/manifest.json"
          test -s build/manifest.json
          test -s build/gptadmin-sbom.spdx.json

      - name: Verify installer links for shipped targets
        run: |
          python3 tools/verify_installer_links.py \
            --installer deploy/install.sh \
            --target linux/amd64 \
            --target darwin/arm64 \
            --android \
            --json

      - name: Scan dependencies for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          GOVULNCHECK="$(go env GOPATH)/bin/govulncheck"
          (
            cd go-hub
            "$GOVULNCHECK" ./...
          )
          (
            cd go-shellmcp
            "$GOVULNCHECK" ./...
          )
          (
            cd go-proxyrelay
            "$GOVULNCHECK" ./...
          )
          npm audit --prefix admin-ui --omit=dev --audit-level=high

      - name: Attest verified release artifacts
        # GitHub does not offer artifact attestations for user-owned private
        # repositories. Do not block the verified public release on that
        # platform limitation; the manifest/SBOM and security gates above
        # remain mandatory for every tagged release.
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.private == false
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/*.tar.gz
            build/*.zip
            build/manifest.json
            build/gptadmin-sbom.spdx.json

      # --- Release: only on v* tags, only if the opensource PAT is configured ---
      - name: Checkout opensource (public) repo
        if: startsWith(github.ref, 'refs/tags/v') && env.OPENSOURCE_PAT != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: megamen32/gptadmin_opensource
          token: ${{ env.OPENSOURCE_PAT }}
          path: gptadmin_opensource
          fetch-depth: 0

      - name: Mirror source + tag + GitHub Release to public repo
        if: startsWith(github.ref, 'refs/tags/v') && env.OPENSOURCE_PAT != ''
        env:
          GH_TOKEN: ${{ env.OPENSOURCE_PAT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PUB="$GITHUB_WORKSPACE/gptadmin_opensource"
          SRC="$GITHUB_WORKSPACE"
          echo "=== Mirror private source -> public repo ==="
          # rsync private tree into the public checkout, EXCLUDING things that
          # must never live in the public repo: git internals, build artifacts,
          # venvs, caches, local agent settings, and the public checkout itself.
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='.buildcache' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='gptadmin_opensource' \
            --exclude='.claude' \
            --exclude='.serena' \
            --exclude='private' \
            --exclude='.superpowers' \
            --exclude='*.bak.*' \
            --exclude='node_modules' \
            --exclude='.gitpublic' \
            "$SRC/" "$PUB/"
          cd "$PUB"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "chore: sync source from private repo ${TAG}"
          fi

          expected_public_commit="$(git rev-parse HEAD)"
          shopt -s nullglob
          release_assets=("$SRC"/build/*.tar.gz "$SRC"/build/*.zip "$SRC"/build/manifest.json "$SRC"/build/gptadmin-sbom.spdx.json)
          shopt -u nullglob
          for asset in "${release_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "ERROR: missing release asset: $asset" >&2
              exit 1
            fi
          done
          expected_assets="$({
            for asset in "${release_assets[@]}"; do
              digest="$(sha256sum "$asset" | awk '{print $1}')"
              printf '%s\tsha256:%s\n' "$(basename "$asset")" "$digest"
            done
          } | LC_ALL=C sort)"

          echo "=== Preflight immutable public tag ${TAG} ==="
          public_tag_exists=false
          remote_tag_lines="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          if [[ -n "$remote_tag_lines" ]]; then
            remote_tag_commit="$(printf '%s\n' "$remote_tag_lines" | awk '$2 ~ /\^\{\}$/ {print $1}')"
            if [[ -z "$remote_tag_commit" ]]; then
              remote_tag_commit="$(printf '%s\n' "$remote_tag_lines" | awk '$2 !~ /\^\{\}$/ {print $1}')"
            fi
            if [[ "$remote_tag_commit" != "$expected_public_commit" ]]; then
              echo "ERROR: public tag ${TAG} targets ${remote_tag_commit}, expected ${expected_public_commit}" >&2
              exit 1
            fi
            public_tag_exists=true
          fi

          echo "=== Preflight immutable public release ${TAG} ==="
          release_response="$RUNNER_TEMP/gptadmin-public-release-${TAG}.txt"
          release_error="$RUNNER_TEMP/gptadmin-public-release-${TAG}.err"
          release_status=404
          if gh api --include "repos/megamen32/gptadmin_opensource/releases/tags/${TAG}" >"$release_response" 2>"$release_error"; then
            release_status=200
          else
            release_status="$(awk '/^HTTP\// {status=$2} END {print status}' "$release_response")"
            if [[ "$release_status" != 404 ]]; then
              echo "ERROR: failed to inspect existing public release ${TAG}" >&2
              sed -n '1,20p' "$release_error" >&2
              exit 1
            fi
          fi

          if [[ "$release_status" == 200 ]]; then
            actual_release_tag="$(gh release view "${TAG}" --repo megamen32/gptadmin_opensource --json tagName --jq '.tagName')"
            if [[ "$actual_release_tag" != "$TAG" ]]; then
              echo "ERROR: public release tag ${actual_release_tag} does not match ${TAG}" >&2
              exit 1
            fi
            actual_assets="$(gh release view "${TAG}" --repo megamen32/gptadmin_opensource --json assets --jq '.assets[] | [.name, (.digest // "")] | @tsv' | LC_ALL=C sort)"
            if [[ "$actual_assets" != "$expected_assets" ]]; then
              echo "ERROR: public release ${TAG} assets do not exactly match local artifact digests" >&2
              exit 1
            fi
          fi

          echo "=== Immutable public identity preflight passed ==="
          git push origin HEAD:main

          if [[ "$public_tag_exists" == true ]]; then
            echo "Public tag ${TAG} already targets the expected commit."
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "refs/tags/${TAG}:refs/tags/${TAG}"
          fi

          echo "=== Publish GitHub Release on public repo with binary assets ==="
          if [[ "$release_status" == 200 ]]; then
            echo "Public release ${TAG} already has the exact expected assets; nothing to upload."
          else
            gh release create "${TAG}" --repo megamen32/gptadmin_opensource \
              --title "${TAG}" --generate-notes \
              "${release_assets[@]}"
          fi
          echo "=== Public release published: https://github.com/megamen32/gptadmin_opensource/releases/tag/${TAG} ==="

      - name: Skip release when not a tag or PAT missing
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || env.OPENSOURCE_PAT == '' }}
        run: |
          echo "Build finished."
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "(Not a tag — skipping release/public-sync. Binaries were built and tested only.)"
          fi
          if [[ -z "${OPENSOURCE_PAT}" ]]; then
            echo "(OPENSOURCE_PAT secret not configured — skipped public repo sync/release.)"
          fi

  macos-build:
    # Catches Darwin-only regressions before merge. We just want real darwin
    # runtime coverage (syscall/exec behavior used by launchd auto-update) plus
    # proof that Mac can produce Linux artifacts. No secrets, no opensource
    # sync, no service install — those are Linux-only and run in build-and-release.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: |
            go-hub/go.sum
            go-shellmcp/go.sum

      - name: Test Go hub on darwin
        run: |
          cd go-hub
          go test ./...

      - name: Test Go shellmcp on darwin
        run: |
          cd go-shellmcp
          go test ./...

      - name: Cross-compile Linux artifacts from Mac
        run: |
          cd go-hub
          GOOS=linux GOARCH=amd64 go build ./...

      - name: Parse Python CLI
        run: python3 -c "import ast; ast.parse(open('cli.py').read())"

  windows-shellmcp:
    # Windows needs a real runner: cross-compilation cannot exercise cmd.exe
    # process creation or the installer-compatible polling configuration.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: go-shellmcp/go.sum

      - name: Compile every Go Hub package for Windows
        shell: pwsh
        run: |
          Set-Location go-hub
          go test -run '^$' ./...
          go build -o ../build/windows/gptadmin-hub.exe ./cmd/gptadmin-hub

      - name: Compile every Go ShellMCP package for Windows
        shell: pwsh
        run: |
          Set-Location go-shellmcp
          go test -run '^$' ./...
          go build -o ../build/windows/shellmcp.exe ./cmd/shellmcp-go

      - name: Exercise Windows polling configuration contract
        shell: pwsh
        run: |
          Set-Location go-shellmcp
          go test ./internal/server -run '^(TestFromEnvUsesWindowsInstallerPollingContract|TestQueueTransportNeverNeedsLocalListener)$' -count=1
