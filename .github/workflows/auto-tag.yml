name: Auto-tag release

# On every main push, create and push a v<VERSION> git tag if it does not
# already exist, then dispatch
# .github/workflows/build-and-sync.yml on that tag, which builds the binaries,
# mirrors source into the public repo, and publishes the binaries as a GitHub
# Release (assets) on megamen32/gptadmin_opensource.
#
# We dispatch explicitly (rather than relying on build-and-sync.yml's
# `on: push: tags` trigger) because a tag pushed with the workflow's
# GITHUB_TOKEN does NOT fire push events for other workflows — GitHub
# suppresses that to prevent loops. An explicit workflow_dispatch is not
# subject to that suppression.
# If a main push reuses an already-published VERSION, advance VERSION in a
# bot commit before tagging. This keeps release numbering automatic.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-tag-release-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.maybe_tag.outputs.created }}
      tag: ${{ steps.maybe_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: maybe_tag
        name: Create v<VERSION> tag if missing
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          v="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$v" =~ ^[0-9]+$ ]]; then
            echo "VERSION '$v' is not a plain integer; refusing to tag"
            exit 1
          fi
          tag="v${v}"
          current_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            git fetch --no-tags origin "refs/tags/${tag}"
            remote_tag_commit="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
            if [[ "$remote_tag_commit" == "$current_commit" ]]; then
              echo "Remote tag ${tag} already targets the current commit; nothing to do."
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "tag=${tag}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "VERSION ${v} is already published; advancing it before release."
            next=$((v + 1))
            while git ls-remote --exit-code --tags origin "refs/tags/v${next}" >/dev/null 2>&1; do
              next=$((next + 1))
            done
            printf '%s\n' "$next" > VERSION
            git add VERSION
            git commit -m "build: advance release version to ${next}"
            git push origin HEAD:main
            echo "VERSION was advanced to ${next}; tagging that exact commit."
            current_commit="$(git rev-parse HEAD)"
            tag="v${next}"
          else
            remote_status=$?
            if [[ "$remote_status" -ne 2 ]]; then
              echo "ERROR: failed to inspect remote tag ${tag}" >&2
              exit "$remote_status"
            fi
          fi
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            git tag -d "${tag}"
          fi
          echo "Creating and pushing tag ${tag}"
          git tag -a "${tag}" "${current_commit}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}:refs/tags/${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release workflow on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh CLI infers the repo from the local git checkout; this job has
          # none (no actions/checkout step), so it fails with
          # "fatal: not a git repository". Pin the repo explicitly instead.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          echo "Dispatching build-and-sync.yml on ref ${tag}"
          for attempt in 1 2 3 4 5 6; do
            # A just-pushed tag can take a few seconds to become visible to
            # the Actions dispatch API. Do not lose the release to HTTP 422.
            if gh api "repos/${GH_REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              if gh workflow run build-and-sync.yml --ref "${tag}"; then
                exit 0
              fi
            fi
            echo "Tag ${tag} is not dispatchable yet (attempt ${attempt}); retrying."
            sleep 5
          done
          echo "ERROR: could not dispatch build-and-sync.yml for ${tag}" >&2
          exit 1
