name: Auto-tag release

# When VERSION is bumped on main (the "Release build N" commits), create and
# push a v<VERSION> git tag if it does not already exist, then dispatch
# .github/workflows/build-and-sync.yml on that tag, which builds the binaries,
# mirrors source into the public repo, and publishes the binaries as a GitHub
# Release (assets) on megamen32/gptadmin_opensource.
#
# We dispatch explicitly (rather than relying on build-and-sync.yml's
# `on: push: tags` trigger) because a tag pushed with the workflow's
# GITHUB_TOKEN does NOT fire push events for other workflows — GitHub
# suppresses that to prevent loops. An explicit workflow_dispatch is not
# subject to that suppression.
# Idempotent: a repeat push of the same VERSION skips tagging and re-dispatch.

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.maybe_tag.outputs.created }}
      tag: ${{ steps.maybe_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: maybe_tag
        name: Create v<VERSION> tag if missing
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          v="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$v" =~ ^[0-9]+$ ]]; then
            echo "VERSION '$v' is not a plain integer; refusing to tag"
            exit 1
          fi
          tag="v${v}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Creating and pushing tag ${tag}"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Release workflow on the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh CLI infers the repo from the local git checkout; this job has
          # none (no actions/checkout step), so it fails with
          # "fatal: not a git repository". Pin the repo explicitly instead.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          echo "Dispatching build-and-sync.yml on ref ${tag}"
          gh workflow run build-and-sync.yml --ref "${tag}"
