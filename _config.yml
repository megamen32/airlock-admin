# Jekyll config for the GitHub Pages docs site.
#
# This repo holds 640 skill source files under skills/ (DESIGN.md, SKILL.md,
# LaTeX tables, TypeScript types, Python f-strings). Jekyll treats every .md
# file as a Liquid template, so skill source containing {% ... %} and
# {{ ... }} breaks the build (Liquid::SyntaxError). Skills are dev artifacts,
# not site content — exclude them from the Pages build.
#
# NOTE: in Jekyll 3 setting `exclude` replaces the default excludes, so the
# standard ones (node_modules, vendor, Gemfile, caches) are listed here too.
title: gptadmin
description: gptadmin — hub, adapters, MCP and docs

exclude:
  - skills
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - .sass-cache
  - .jekyll-cache
  - git-privado.py
  - test_adapters.py
