# Shared proxy-auth secret for *.airlock.bezrabotnyi.com agent subdomains.
# Kept in sync with /home/roomhacker/airlock-admin/airlock/.env
# (REVERSE_PROXY_AUTH_SECRET) — airlock refuses agent requests that arrive
# without this header. nginx verifies it at the edge and strips it before
# forwarding to the backend, so the secret never reaches the application.
#
# ROTATION: when airlock's .env secret changes, update `proxy_auth_secret`
# here too and `sudo nginx -s reload`.
map $http_x_airlock_proxy_auth $proxy_auth_secret {
    default "8581c37c5dc45a73bc954c335190794bbc81c5517bf83cddf6b1978d37e19441";
}
